<div data-reveal="0" style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font:500 12px 'JetBrains Mono',monospace;color:#5d6e6a">

</div>

<div style="display:flex;flex-direction:column;gap:.06em;font-size:clamp(46px,9.2vw,136px);font-weight:700;line-height:1.18;letter-spacing:-.02em">
<div data-reveal="80" onClick="{{ h0.toggle }}" style="display:flex;align-items:center;gap:.34em;cursor:pointer;width:fit-content;user-select:none">

</div>
<div data-reveal="160" onClick="{{ h1.toggle }}" style="display:flex;align-items:center;gap:.34em;cursor:pointer;width:fit-content;user-select:none">
<span style="width:.74em;height:.74em;border-radius:.15em;box-sizing:border-box;flex:none;display:flex;align-items:center;justify-content:center;transition:background .25s,border-color .25s;background:{{ h1.bg }};border:.065em solid {{ h1.bc }}"><span class="ms" style="font-size:.6em;color:#ffffff;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s;transform:scale({{ h1.cs }});opacity:{{ h1.co }}">check</span></span>
<span style="position:relative;transition:color .4s;color:{{ h1.color }}">チェックする<span style="position:absolute;left:-.04em;top:56%;height:.07em;border-radius:.04em;background:#0f1a18;transition:width .5s cubic-bezier(.65,0,.25,1);width:{{ h1.lw }}"></span></span>

</div>
<div data-reveal="240" onClick="{{ h2.toggle }}" style="display:flex;align-items:center;gap:.34em;cursor:pointer;width:fit-content;user-select:none">
<span style="width:.74em;height:.74em;border-radius:.15em;box-sizing:border-box;flex:none;display:flex;align-items:center;justify-content:center;transition:background .25s,border-color .25s;background:{{ h2.bg }};border:.065em solid {{ h2.bc }}"><span class="ms" style="font-size:.6em;color:#ffffff;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s;transform:scale({{ h2.cs }});opacity:{{ h2.co }}">check</span></span>
<span style="position:relative;transition:color .4s;color:{{ h2.color }}">どこでも続ける<span style="position:absolute;left:-.04em;top:56%;height:.07em;border-radius:.04em;background:#0f1a18;transition:width .5s cubic-bezier(.65,0,.25,1);width:{{ h2.lw }}"></span></span>
<sc-if value="{{ h2.hint }}" hint-placeholder-val="{{ false }}"><span style="font:500 13px 'JetBrains Mono';letter-spacing:0;color:#00796b;align-self:center;display:flex;align-items:center;gap:6px"><span class="ms" style="font-size:18px">arrow_back</span>押してみる</span></sc-if>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:32px;align-items:end">
<p data-reveal="320" style="margin:0;font-size:17px;line-height:1.9;color:#3d4d49;max-width:30em;text-wrap:pretty">kakitome は、チェックリストを中心にしたシンプルなメモアプリです。ホーム画面のウィジェットから、アプリを開かずに項目にチェックできます。</p>
<div data-reveal="400" style="display:flex;flex-direction:column;align-items:flex-start;gap:16px;justify-self:end">
<div style="display:flex;flex-wrap:wrap;gap:10px">
<a href="#download" style="height:54px;padding:0 24px;border-radius:12px;background:#ffca28;color:#10201d;font-size:15px;font-weight:700;text-decoration:none;display:flex;align-items:center;gap:8px;transition:transform .2s" style-hover="transform:translateY(-2px);color:#10201d"><span class="ms" style="font-size:20px">android</span>Android 版をダウンロード</a>
<a href="#features" style="height:54px;padding:0 20px;border-radius:12px;border:1px solid #cfd9d5;background:#ffffff;color:#0f1a18;font-size:15px;text-decoration:none;display:flex;align-items:center;gap:8px" style-hover="border-color:#0f1a18;color:#0f1a18"><span class="ms" style="font-size:20px">south</span>機能を見る</a>
</div>
<span style="font:500 12px 'JetBrains Mono';color:{{ heroCountColor }};display:flex;align-items:center;gap:6px;transition:color .3s"><span class="ms" style="font-size:16px">{{ heroCountIcon }}</span>{{ heroCount }}</span>
</div>
</div>
</div>
</section>

</div>
</sc-if>

<div style="position:absolute;bottom:34px;display:flex;gap:24px"><img src="assets/images/icon.png" alt="" style="width:52px;height:52px;border-radius:16px"><div style="width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.16)"></div><div style="width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.16)"></div><div style="width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.16)"></div></div>

<script>
// 小さなテンプレートエンジン。デザイン（.dc.html）の {{ path }}・<sc-if>・<sc-for>・onClick・style-hover だけを扱う
(() => {
  const get = (scope, path) => path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope);
  const BIND = /\{\{\s*([\w.]+)\s*\}\}/g;
  const interp = (s, scope) => s.replace(BIND, (_, p) => { const v = get(scope, p); return v == null ? '' : v; });
  const only = (s) => { const m = /^\s*\{\{\s*([\w.]+)\s*\}\}\s*$/.exec(s); return m && m[1]; };
  const has = (s) => s.includes('{{');

  // build: テンプレートのノードから、DOM と update(scope) を作る
  function build(node, scope) {
    if (node.nodeType === 3) {
      const t = node.textContent;
      const dom = document.createTextNode(has(t) ? interp(t, scope) : t);
      return { dom, update: has(t) ? (sc) => { const v = interp(t, sc); if (dom.textContent !== v) dom.textContent = v; } : null };
    }
    if (node.nodeType !== 1) return { dom: null, update: null };
    const tag = node.tagName.toLowerCase();

    if (tag === 'sc-if') {
      const path = only(node.getAttribute('value'));
      const dom = document.createElement('div');
      dom.style.display = 'contents';
      let kids = null;
      return {
        dom,
        update(sc) {
          const on = !!get(sc, path);
          if (on && !kids) { kids = buildKids(node, sc, dom); }
          else if (!on && kids) { dom.textContent = ''; kids = null; }
          if (kids) kids.forEach((k) => k.update && k.update(sc));
        },
      };
    }

    if (tag === 'sc-for') {
      const path = only(node.getAttribute('list'));
      const as = node.getAttribute('as');
      const dom = document.createElement('div');
      dom.style.display = 'contents';
      const rows = [];
      return {
        dom,
        update(sc) {
          const list = get(sc, path) || [];
          while (rows.length < list.length) {
            const holder = document.createElement('div');
            holder.style.display = 'contents';
            dom.appendChild(holder);
            rows.push({ holder, kids: buildKids(node, { ...sc, [as]: list[rows.length] }, holder) });
          }
          while (rows.length > list.length) rows.pop().holder.remove();
          rows.forEach((r, i) => r.kids.forEach((k) => k.update && k.update({ ...sc, [as]: list[i] })));
        },
      };
    }

    const el = document.createElement(tag);
    const binds = [];
    let hover = null, hovered = false, scopeNow = scope, baseStyle = '';
    const clicks = [];
    for (const a of node.attributes) {
      if (/-placeholder-(val|count)$/.test(a.name)) continue;
      if (a.name === 'style-hover') { hover = a.value; continue; }
      if (a.name === 'onclick') { const p = only(a.value); el.addEventListener('click', (e) => { const f = get(scopeNow, p); if (f) f(e); }); continue; }
      if (has(a.value)) binds.push(a); else el.setAttribute(a.name, a.value);
    }
    const applyStyle = () => { el.setAttribute('style', baseStyle + (hover && hovered ? ';' + hover : '')); };
    if (hover) {
      el.addEventListener('mouseenter', () => { hovered = true; applyStyle(); });
      el.addEventListener('mouseleave', () => { hovered = false; applyStyle(); });
    }
    const kids = buildKids(node, scope, el);
    const last = {};
    const update = (sc) => {
      scopeNow = sc;
      for (const a of binds) {
        const v = interp(a.value, sc);
        if (last[a.name] === v) continue;
        last[a.name] = v;
        if (a.name === 'style') { baseStyle = v; applyStyle(); } else el.setAttribute(a.name, v);
      }
      kids.forEach((k) => k.update && k.update(sc));
    };
    // style が静的で style-hover だけある場合
    if (hover && !binds.some((a) => a.name === 'style')) baseStyle = el.getAttribute('style') || '';
    return { dom: el, update };
  }

  function buildKids(node, scope, parentDom) {
    const kids = [];
    for (const c of node.childNodes) {
      const b = build(c, scope);
      if (b.dom) parentDom.appendChild(b.dom);
      kids.push(b);
    }
    return kids;
  }

  window.mountTemplate = (tpl, root, scope) => {
    const kids = buildKids(tpl.content ? tpl.content : tpl, scope, root);
    return (sc) => kids.forEach((k) => k.update && k.update(sc));
  };

  // デザインのコンポーネント（DCLogic）と同じ形の最小の基底クラス
  window.DCLogic = class {
    setState(p) {
      const patch = typeof p === 'function' ? p(this.state) : p;
      this.state = { ...this.state, ...patch };
      if (this.update) this.update(this.renderVals());
    }
  };
})();

</script>
<script>

const INIT = [
  { id: 1, text: '牛乳', done: false },
  { id: 2, text: '卵', done: false },
  { id: 3, text: '食パン', done: true },
  { id: 4, text: 'トマト', done: false },
  { id: 5, text: '洗剤', done: false },
];
const REPEATS = ['なし', '毎日', '毎週', '毎月', '毎年'];
const NAMES = ['シンプルな画面', 'ウィジェット', '同期', '画像', 'リマインド', 'Google Keep'];
const PHOTOS = ['hotel.jpg', 'map.png', 'ticket.jpg'];
class Component extends DCLogic {
  state = { items: INIT, hero: [false, false, false], touched: false, active: 0, vw: 1280, vh: 800, repeat: '毎週', notif: false, sync: 'idle', syncedAt: '09:38', viewer: -1, imp: 'idle', impPct: 0 };
  componentDidMount() {
    this.onResize = () => this.setState({ vw: window.innerWidth, vh: window.innerHeight });
    this.onScroll = () => {
      let a = 0;
      document.querySelectorAll('[data-step]').forEach((el, i) => { if (el.getBoundingClientRect().top < window.innerHeight * 0.5) a = i; });
      if (window.__kkStep != null) a = window.__kkStep;
      if (a !== this.state.active) {
        clearTimeout(this.nt);
        this.setState({ active: a, notif: false, viewer: -1 });
        if (a === 4) this.nt = setTimeout(() => this.setState({ notif: true }), 650);
      }
    };
    window.addEventListener('resize', this.onResize);
    window.addEventListener('scroll', this.onScroll, true);
    this.onResize(); this.onScroll();
    this.io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      const el = e.target, d = el.dataset.reveal || 0;
      el.style.transition = `opacity 1s cubic-bezier(.2,.7,.2,1) ${d}ms, transform 1s cubic-bezier(.2,.7,.2,1) ${d}ms`;
      el.style.opacity = '1'; el.style.transform = 'none';
      this.io.unobserve(el);
    }), { threshold: 0.12 });
    requestAnimationFrame(() => document.querySelectorAll('[data-reveal]').forEach(el => {
      el.style.opacity = '0'; el.style.transform = 'translateY(28px)'; this.io.observe(el);
    }));
    this.ht = setTimeout(() => { if (!this.state.touched) this.setState(s => ({ hero: [true, s.hero[1], s.hero[2]] })); }, 1500);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('scroll', this.onScroll, true);
    this.io && this.io.disconnect();
    [this.nt, this.ht, this.st].forEach(clearTimeout); clearInterval(this.it);
  }
  toggleItem(id) {
    clearTimeout(this.st);
    this.setState(s => ({ items: s.items.map(i => i.id === id ? { ...i, done: !i.done } : i), sync: 'busy' }));
    this.st = setTimeout(() => this.setState({ sync: 'idle', syncedAt: 'たった今' }), 800);
  }
  runImport() {
    if (this.state.imp === 'run') return;
    if (this.state.imp === 'done') return this.setState({ imp: 'idle', impPct: 0 });
    this.setState({ imp: 'run', impPct: 0 });
    clearInterval(this.it);
    this.it = setInterval(() => {
      const p = Math.min(100, this.state.impPct + 3);
      this.setState({ impPct: p, imp: p >= 100 ? 'done' : 'run' });
      if (p >= 100) clearInterval(this.it);
    }, 50);
  }
  renderVals() {
    const { items, hero, touched, active, vw, vh, repeat, notif, sync, syncedAt, viewer, imp, impPct } = this.state;
    const narrow = vw < 820;
    const open = items.filter(i => !i.done), doneI = items.filter(i => i.done);
    const view = i => ({
      text: i.text, toggle: () => this.toggleItem(i.id),
      bg: i.done ? '#00897b' : 'transparent', border: i.done ? '1.5px solid #00897b' : '1.5px solid #8fa39e',
      cs: i.done ? 1 : 0, color: i.done ? '#94a5a1' : '#0f1a18', deco: i.done ? 'line-through' : 'none',
    });
    const firstOff = hero.indexOf(false);
    const heroRow = i => {
      const on = hero[i];
      return {
        toggle: () => this.setState(s => { const h = [...s.hero]; h[i] = !h[i]; return { hero: h, touched: true }; }),
        bg: on ? '#00897b' : 'transparent', bc: on ? '#00897b' : '#0f1a18', cs: on ? 1 : 0.3, co: on ? 1 : 0,
        color: on ? '#94a5a1' : '#0f1a18', lw: on ? 'calc(100% + .08em)' : '0%',
        hint: !narrow && i === firstOff && hero.filter(Boolean).length < 2,
      };
    };
    const heroN = hero.filter(Boolean).length;
    // stage geometry
    const s = narrow ? Math.min((vh * 0.5) / 776, (vw - 48) / 376) : Math.min(1, (vh - 170) / 776);
    const pW = 376 * s, pH = 776 * s;
    const colW = narrow ? vw - 48 : ((Math.min(vw, 1280) - 48 - 48) * 6) / 11;
    const shown = Math.min(active, 4);
    const sc = i => ({ op: shown === i ? 1 : 0, tf: shown === i ? 'none' : 'scale(.97)', pe: shown === i ? 'auto' : 'none' });
    const shift = narrow ? 30 : 44;
    let phoneTf = 'none', phoneOp = 1;
    if (active === 2) phoneTf = `translateX(${shift}px)`;
    if (active === 5) { phoneTf = 'translateX(80px) scale(.92)'; phoneOp = 0; }
    let bW, tx, ty, bOp = 0;
    const smallW = narrow ? Math.min(210, vw * 0.5) : Math.min(270, colW * 0.5);
    if (active === 5) { bW = narrow ? Math.min(vw - 40, 420) : Math.min(colW - 20, 540); tx = 0; ty = 0; bOp = 1; }
    else { bW = smallW; tx = -pW / 2 - bW / 2 + shift + (narrow ? 60 : 70); ty = pH * 0.22 + (active === 2 ? 0 : 40); bOp = active === 2 ? 1 : 0; }
    const impTitle = imp === 'idle' ? 'takeout-20261004.zip' : imp === 'run' ? '取り込んでいます…' : '42 件のメモを取り込みました';
    return {
      h0: heroRow(0), h1: heroRow(1), h2: heroRow(2),
      heroCount: heroN === 3 ? 'すべて完了' : `完了 ${heroN}/3`,
      heroCountIcon: heroN === 3 ? 'task_alt' : 'checklist', heroCountColor: heroN === 3 ? '#00796b' : '#5d6e6a',
      progress: `${doneI.length}/${items.length}`, pct: `${(doneI.length / items.length) * 100}%`,
      allDone: open.length === 0, reset: () => this.setState({ items: INIT }),
      cardItems: open.slice(0, 3).map(view), hasMore: open.length > 3,
      moreLabel: `ほか ${open.length - 3} 件 · 完了 ${doneI.length}`,
      totalOpen: open.length + 4, totalDone: doneI.length + 2,
      widgetItems: [...open, ...doneI].map(view), openList: open.map(view), doneList: doneI.map(view), doneCount: doneI.length,
      syncLabel: sync === 'busy' ? '同期しています…' : `${syncedAt} に更新 · 同期済み`,
      syncColor: sync === 'busy' ? '#5c4300' : '#00796b', syncIcon: sync === 'busy' ? 'sync' : 'cloud_done',
      repeats: REPEATS.map((r, idx) => ({ label: r, select: () => this.setState({ repeat: r }), bg: r === repeat ? '#00897b' : 'transparent', fg: r === repeat ? '#ffffff' : '#3d4d49', bl: idx === 0 ? 'none' : '1px solid #dde5e2' })),
      repeatSuffix: repeat === 'なし' ? '' : ` · ${repeat}`,
      notifY: notif ? '0' : '-150%', notifOp: notif ? 1 : 0,
      notifBody: open.length ? open.slice(0, 2).map(i => i.text).join('・') + (open.length > 2 ? ` ほか ${open.length - 2} 件` : '') : 'すべて完了しています',
      thumbs: PHOTOS.map((p, i) => ({ label: 'photo', open: () => this.setState({ viewer: i }), border: viewer === i ? '2px solid #ffca28' : '1px solid #22302d' })),
      viewerOpen: viewer >= 0, viewerLabel: `${viewer + 1} / 3`, viewerName: PHOTOS[viewer] || '',
      closeViewer: () => this.setState({ viewer: -1 }), nextViewer: () => this.setState(st => ({ viewer: (st.viewer + 1) % 3 })),
      runImport: () => this.runImport(), impPct: `${impPct}%`, impTitle,
      impIcon: imp === 'done' ? 'task_alt' : imp === 'run' ? 'hourglass_top' : 'folder_zip',
      impMeta: imp === 'idle' ? 'ZIP' : `${impPct}%`,
      impNote: imp === 'done' ? '同期をオンにしているので、スマホにも届きます。もう一度押すと最初に戻ります。' : 'チェックリスト・画像・ピン留め・ラベルを引き継ぎます。',
      wide: !narrow,
      gridCols: narrow ? 'minmax(0,1fr)' : 'minmax(0,5fr) minmax(0,6fr)',
      stageCol: narrow ? '1' : '2', stageTop: narrow ? '68px' : '60px', stageH: narrow ? `${pH + 24}px` : 'calc(100vh - 60px)',
      stepJustify: narrow ? 'flex-end' : 'center',
      cardBg: narrow ? '#ffffff' : 'transparent', cardPad: narrow ? '22px' : '0', cardShadow: narrow ? '0 10px 40px rgba(15,26,24,.12), 0 0 0 1px #dde5e2' : 'none',
      stepNo: String(active + 1).padStart(2, '0'), stepName: NAMES[active],
      ticks: NAMES.map((n, i) => ({ bg: i === active ? '#00897b' : i < active ? '#8fa39e' : '#dde5e2' })),
      phoneW: `${pW}px`, phoneH: `${pH}px`, phoneScale: s, phoneTf, phoneOp,
      sc0: sc(0), sc1: sc(1), sc2: sc(2), sc3: sc(3), sc4: sc(4),
      bW: `${bW}px`, bOp, bPe: bOp ? 'auto' : 'none',
      bTf: `translate(-50%,-50%) translate(${tx}px,${ty}px)`,
      bList: active !== 5, bImport: active === 5,
    };
  }
}

(() => {
  const c = new Component();
  const root = document.getElementById("root");
  c.update = window.mountTemplate(document.getElementById("tpl"), root, c.renderVals());
  c.update(c.renderVals());
  c.componentDidMount();
})();
</script>
